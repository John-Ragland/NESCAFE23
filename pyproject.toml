[project]
name = "nescafe23"
version = "2026.04.09"
description = "Code for analysis and research related to the 2023 pilot New England Seamounts Calibrated Acoustic Fluctuation Experiment (NESCAFE23)."

readme = "README.md"
authors = [
    { name = "John Ragland", email = "john.ragland@whoi.edu" },
    { name = "John Colosi", email = "jcolosi@whoi.edu" },
]

classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

requires-python = ">=3.10"
dependencies = [
  "python-dotenv",
  "questionary",
  "xarray[complete]",
  "gsw",
  "h5py",
  "xrsignal",
  "matplotlib",
  "numpy",
  "scipy",
  "fsspec",
  "tqdm",
  "pygenray",
  "ipympl",
]

[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
]
dev = [
  { include-group = "test" },
  "ipykernel",
  "pre-commit",
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]

[project.scripts]
nescafe23 = "nescafe23.cli:main"

[project.urls]
Homepage = "https://github.com/John-Ragland/NESCAFE23"
"Bug Tracker" = "https://github.com/John-Ragland/NESCAFE23/issues"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["projects/*", "packages/*"]

[tool.uv.sources]
pygenray = { git = "https://github.com/John-Ragland/pygenray", branch = "main" }

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--import-mode=importlib"]
strict_markers = true
# ignore::pytest.PytestConfigWarning lets missing testpath dirs degrade gracefully
# — allows CI to check out only a subset of submodules and still collect tests
# from the ones that are populated.
filterwarnings = [
    "error",
    "ignore::pytest.PytestConfigWarning",
]
log_level = "INFO"
testpaths = [
    "tests",
    "packages/acoustic_inversion/tests",
    "packages/nesma_param/tests",
    "projects/n23_inversion_ragland/tests",
    "projects/n23_fluctuations_ragland/tests",
    "projects/n23_source_localization_hoekstra/tests",
    "projects/n23_PE_boundary_decourcy/tests",
]


[tool.ruff]
extend-exclude = ["notebooks", "dev", "*.ipynb"]

[tool.ruff.lint]
extend-select = [
  "B",    # flake8-bugbear
  "I",    # isort
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
  "NPY",  # numpy-specific
  "PD",   # pandas-vet
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
]
